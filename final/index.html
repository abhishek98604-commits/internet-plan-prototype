<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final Design · Interactive Prototype</title>
<meta name="description" content="The final home internet checkout flow as an interactive prototype in a phone frame. Portfolio case study by Abhishek Bora.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23eb1d21%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%227%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%224%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,1,0&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
.wrap{display:flex;flex-direction:column;align-items:center;gap:20px;transform-origin:top center}
/* White phone frame */
.phone{width:384px;padding:12px;border-radius:56px;background:linear-gradient(145deg,#ffffff,#e9eaee 55%,#f6f6f8);border:1px solid #d6d8dd;box-shadow:0 0 0 1px rgba(255,255,255,.6) inset,0 30px 60px -24px rgba(255,255,255,.08);position:relative}
.phone::before,.phone::after{content:"";position:absolute;width:3px;border-radius:2px;background:#cfd1d6}
.phone::before{left:-4px;top:150px;height:56px}
.phone::after{right:-4px;top:190px;height:80px}
.screen{position:relative;height:780px;border-radius:44px;overflow:hidden;background:#fff;display:flex;flex-direction:column;border:1px solid #d9dbe0}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;font-size:15px;font-weight:600;color:#000;position:relative;background:#fff}
.island{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:96px;height:28px;border-radius:16px;background:#000}
.icons{display:flex;gap:5px;align-items:center}
.ms{font-family:"Material Symbols Outlined";font-size:17px;line-height:1;width:1em;height:1em;overflow:hidden;display:inline-block;font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 20}
iframe{flex:1;width:100%;border:0;display:block;background:#fff}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:3px;background:rgba(0,0,0,.28);pointer-events:none}
.cap{text-align:center}
.cap b{display:block;font-size:15px;font-weight:700}
.cap span{display:block;font-size:13px;color:#a1a1a6;margin-top:3px}
.note{font-size:12px;color:#6e6e73;margin-top:18px;text-align:center}
@media (max-width:420px){ .phone{width:100%;max-width:384px} }
</style>
</head>
<body>
<main class="stage">
  <div class="wrap" id="wrap">
    <div class="phone">
      <div class="screen">
        <div class="status"><span>9:41</span><span class="island"></span><span class="icons"><span class="ms">signal_cellular_alt</span><span class="ms">wifi</span><span class="ms">battery_full</span></span></div>
        <iframe src="../?embed=1#plan" title="Final design interactive prototype"></iframe>
        <div class="home-ind"></div>
      </div>
    </div>
    <div class="cap"><b>Final design</b><span>Choose a plan, add optional services, then review your order</span></div>
  </div>
  <p class="note">Interactive prototype. Scroll and tap inside the phone. Portfolio prototype, not a real store; brand replaced with a placeholder.</p>
</main>
<script>
function fit(){
  const w = document.getElementById('wrap');
  const H = w.offsetHeight, W = w.offsetWidth;
  const kh = innerHeight > 360 ? (innerHeight - 90)/H : 1;
  const k = Math.max(.4, Math.min(1, (innerWidth - 32)/W, kh));
  w.style.transform = k<1 ? `scale(${k})` : '';
  w.style.marginBottom = k<1 ? `${-(H*(1-k))}px` : '';
}
addEventListener('resize', fit); addEventListener('load', fit); fit(); setTimeout(fit, 600);
</script>
</body>
</html>
